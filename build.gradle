import org.flywaydb.gradle.task.FlywayMigrateTask

buildscript {
  dependencies {
    classpath("org.flywaydb:flyway-database-postgresql:13.7.0")
  }
}
plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.github.ben-manes.versions' version '0.64.0'
  id 'org.sonarqube' version '7.5.0.8588'
  id "org.openapi.generator" version "7.25.0"
  /*
    Applies analysis tools including checkstyle and OWASP Dependency checker.
    See https://github.com/hmcts/gradle-java-plugin
 */
  id 'uk.gov.hmcts.java' version '0.12.70'
  id 'org.flywaydb.flyway' version '13.7.0'
  id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

application {
  mainClass = 'uk.gov.hmcts.opal.filehandler.Application'
  group = 'uk.gov.hmcts.opal'
  version = '0.0.1'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

ext {
  serenityVersion = "5.3.11"
  cucumberVersion = "7.34.8"
  log4JVersion = "2.26.1"
  logbackVersion = "1.6.3"
}

def logPublishedHtmlReport = { String label, String reportDirectory ->
  def indexFile = file("${reportDirectory}/index.html")
  if (indexFile.exists()) {
    logger.lifecycle("${label} available at - file://${indexFile.absolutePath}")
  } else {
    logger.lifecycle("${label} was not generated at ${reportDirectory}")
  }
}

def xjcGeneratedSourceDir = layout.buildDirectory.dir('generated/sources/xjc/main')
// XJC is the JAXB XML-to-Java compiler. Add future third-party XML schemas here
// to generate typed Java classes from XSD files at build time.
def xmlSchemasToGenerate = [
    pacsTtp: [
        xsd        : 'src/main/resources/xsd/pacs-tpp-schedule-v0.0d.xsd',
        packageName: 'uk.gov.hmcts.opal.filehandler.generated.pacs'
    ]
]

sourceSets {
  openapi {
    java {
      srcDirs = [file('src/openApi/java')]
    }
    resources.srcDirs = [file('src/openApi/resources')]
  }
  main {
    java {
      srcDir "$buildDir/generated/openapi/src/main/java"
      srcDir xjcGeneratedSourceDir
    }
  }
  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }

  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDir file('src/integrationTest/resources')
  }
}


configurations {
  // JAXB XML-to-Java compiler dependencies used by schema generation tasks.
  xjc

  openapiImplementation.extendsFrom implementation
  openapiRuntimeOnly.extendsFrom runtimeOnly

  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

configurations.configureEach {
  resolutionStrategy {
    force "io.cucumber:cucumber-core:${cucumberVersion}"
    force "io.cucumber:cucumber-java:${cucumberVersion}"
    force "io.cucumber:cucumber-junit:${cucumberVersion}"
  }
}

xmlSchemasToGenerate.each { schemaName, schemaConfig ->
  def taskName = "generate${schemaName.toString().capitalize()}Jaxb"
  def schemaGeneratedPackageDir = xjcGeneratedSourceDir.map {
    it.dir(schemaConfig.packageName.replace('.', '/'))
  }

  tasks.register(taskName, JavaExec) {
    group = 'build'
    description = "Generates JAXB classes from the ${schemaName} XSD"
    classpath = configurations.xjc
    mainClass = 'com.sun.tools.xjc.XJCFacade'
    inputs.file(schemaConfig.xsd)
    outputs.dir(schemaGeneratedPackageDir)
    args = [
        '-d', xjcGeneratedSourceDir.get().asFile.absolutePath,
        '-p', schemaConfig.packageName,
        file(schemaConfig.xsd).absolutePath
    ]
    doFirst {
      delete schemaGeneratedPackageDir
      xjcGeneratedSourceDir.get().asFile.mkdirs()
    }
  }
}

tasks.register("bundleOpenApi", JavaExec) {
  dependsOn 'compileOpenapiJava'
  classpath = sourceSets.openapi.runtimeClasspath
  group = "openapi"
  description = "Bundle multiple OpenAPI YAML files into one"
  mainClass = 'uk.gov.hmcts.opal.openapi.OpenApiBundler'
  args = ["$rootDir/src/main/resources/openapi", layout.buildDirectory.file("openapi-bundled.yaml").get().asFile.absolutePath]
}

openApiGenerate {
  generatorName = "spring"
  inputSpec = layout.buildDirectory.file("openapi-bundled.yaml").get().asFile.absolutePath
  outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.absolutePath
  apiPackage = "uk.gov.hmcts.opal.generated.".toString() + "http.api"
  modelPackage = "uk.gov.hmcts.opal.generated.".toString() + "model"
  importMappings = [
          Nullable: "org.jspecify.annotations.Nullable"
  ]
  // Point to your customized mustache templates
  templateDir = "$rootDir/openapi/templates".toString()
  generateApiTests = false
  generateModelTests = false
  skipOperationExample = true
  openapiNormalizer = [
          REF_AS_PARENT_IN_ALLOF: "true"
  ]
  configOptions = [
          dateLibrary                         : "java8-localdatetime",
          interfaceOnly                       : "true",
          useTags                             : "true",
          useSpringBoot4                      : "true",
          containerDefaultToNull              : "true",
          generatedConstructorWithRequiredArgs: "false",
          useBeanValidation                   : "true",
          useLombokAnnotations                : "true",
          generateBuilders                    : "true",
          configPackage                       : "uk.gov.hmcts.opal.generated.configuration"
  ]
}
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.named('sonarResolver') {
  dependsOn(processResources)
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  failFast = true

  testLogging {
    exceptionFormat = 'full'
  }
}

tasks.register('functional', Test) {
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  outputs.upToDateWhen { false }
  reports.junitXml.getOutputLocation().set(layout.buildDirectory.dir("test-results/functional"))
  testLogging.showStandardStreams = true
  def requestedCucumberTags = System.getProperty('cucumber.filter.tags')?.trim()
  def cucumberTags = requestedCucumberTags
      ? "(${requestedCucumberTags}) and not @Ignore"
      : 'not @Ignore'
  systemProperty 'cucumber.filter.tags', cucumberTags
  include '**/FunctionalTestRunner.class'
  dependsOn 'bootJar', 'clearReports'
  finalizedBy 'aggregateFunctionalReport', 'copyFunctionalReport'
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}


tasks.register('smoke', Test) {
  description = "Runs Smoke Tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  outputs.upToDateWhen { false }
  reports.junitXml.getOutputLocation().set(layout.buildDirectory.dir("test-results/smoke"))
  testLogging.showStandardStreams = true
  include '**/SmokeTestRunner.class'
  dependsOn 'bootJar', 'clearReports'
  finalizedBy 'aggregate', 'copySmokeReport'
}

tasks.register('copyFunctionalReport', Sync) {
  dependsOn 'aggregateFunctionalReport'
  from("${rootDir}/target/site/serenity")
  into("${rootDir}/functional-test-report")
  doLast {
    logPublishedHtmlReport("Serenity Functional Test Report", "${rootDir}/functional-test-report")
  }
}

tasks.register('copySmokeReport', Sync) {
  dependsOn 'aggregate'
  from("${rootDir}/target/site/serenity")
  into("${rootDir}/smoke-test-report")
  doLast {
    logPublishedHtmlReport("Serenity Smoke Test Report", "${rootDir}/smoke-test-report")
  }
}

tasks.named('clearReports') {
  doLast {
    delete(
      layout.buildDirectory.dir("test-results/functional"),
      layout.buildDirectory.dir("test-results/smoke")
    )
  }
}

tasks.named('aggregate') {
  testRoot = layout.buildDirectory.dir("test-results").get().asFile.absolutePath
  mustRunAfter tasks.named('functional'), tasks.named('smoke')
}

tasks.register('aggregateFunctionalReport', JavaExec) {
  description = "Generates the functional Serenity report in an isolated JVM"
  group = "Verification"
  dependsOn 'functionalTestClasses'
  classpath = sourceSets.functionalTest.runtimeClasspath
  mainClass = 'uk.gov.hmcts.opal.filehandler.support.SerenityReportGenerator'
  args(
    file("${rootDir}/target/site/serenity").absolutePath,
    layout.buildDirectory.dir("test-results").get().asFile.absolutePath,
    rootDir.absolutePath,
    project.name
  )
  mustRunAfter tasks.named('functional')
}

tasks.named('copyFunctionalReport') {
  mustRunAfter tasks.named('aggregateFunctionalReport')
}

tasks.named('copySmokeReport') {
  mustRunAfter tasks.named('aggregate')
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    html.getRequired().set(true)
  }
}

tasks.sonarqube.dependsOn(jacocoTestReport)
tasks.check.dependsOn(integration)

sonarqube {
  properties {
    property "sonar.projectName", "Opal :: file-handler"
    property "sonar.projectKey", "uk.gov.hmcts.opal:file-handler"
    property 'sonar.coverage.exclusions', "**/config/**"
  }
}

// before committing a change, make sure task still works
dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
  }
}

ext['snakeyaml.version'] = '2.0'
dependencyManagement {
  imports {
    mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'
    mavenBom "com.fasterxml.jackson:jackson-bom:2.22.2"
    mavenBom "io.netty:netty-bom:4.2.18.Final"
  }
}
dependencies {
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  implementation 'org.glassfish.jaxb:jaxb-runtime'
  xjc 'org.glassfish.jaxb:jaxb-xjc'
  xjc 'org.glassfish.jaxb:jaxb-runtime'

  //OpenAPI
  openapiImplementation "io.swagger.parser.v3:swagger-parser:2.1.48"
  openapiImplementation "io.swagger.core.v3:swagger-models:2.2.55"
  openapiImplementation "io.swagger.core.v3:swagger-core:2.2.55"
  openapiImplementation "tools.jackson.dataformat:jackson-dataformat-yaml"
  //HMCTS
  implementation 'uk.gov.hmcts:opal-common-lib:0.3.33'
  implementation 'com.github.hmcts.java-logging:logging:8.0.0'
  testImplementation 'com.launchdarkly:launchdarkly-java-server-sdk:7.17.1'

  //Spring Boot
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

  implementation 'org.springframework.boot:spring-boot-flyway'
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-json"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation "org.springframework.boot:spring-boot-starter-security"
  implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-integration'
  implementation 'org.springframework.security:spring-security-oauth2-authorization-server'
  implementation 'org.springframework.cloud:spring-cloud-starter-openfeign', {
    exclude group: 'commons-fileupload', module: 'commons-fileupload'
  }
  implementation 'org.springframework:spring-jms'
  implementation 'org.springframework.integration:spring-integration-sftp'
  //Other
  implementation 'org.apache.poi:poi-ooxml:5.5.1'

  implementation 'com.azure:azure-storage-blob:12.35.1'
  implementation 'com.microsoft.azure:applicationinsights-web:3.7.10'

  implementation 'commons-logging:commons-logging:1.4.0'
  implementation "org.apache.logging.log4j:log4j-api:${log4JVersion}"
  implementation "org.apache.logging.log4j:log4j-to-slf4j:${log4JVersion}"
  implementation "ch.qos.logback:logback-classic:${logbackVersion}"
  implementation "ch.qos.logback:logback-core:${logbackVersion}"

  implementation 'org.flywaydb:flyway-core:13.7.0'
  runtimeOnly 'org.flywaydb:flyway-database-postgresql:13.7.0', {
    exclude group: 'org.flywaydb', module: 'flyway-core'
  }

  // temporary bump until spring-boot-dependencies updates (CVE-2026-54291)
  implementation 'org.postgresql:postgresql:42.7.13'

  implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.26'
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26'
  implementation 'org.apache.tomcat.embed:tomcat-embed-el:11.0.26'
  implementation 'org.apache.tomcat:tomcat-annotations-api:11.0.26'

  // Azure blob storage
  implementation 'com.azure:azure-storage-blob:12.35.1'

  //Annotation
  annotationProcessor 'org.hibernate.orm:hibernate-processor:7.4.10.Final'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
  integrationTestCompileOnly 'org.projectlombok:lombok:1.18.48'
  integrationTestAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
  functionalTestCompileOnly 'org.projectlombok:lombok:1.18.48'
  functionalTestAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
  implementation 'org.mapstruct:mapstruct:1.6.3'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'


  //Test
  testImplementation 'jakarta.jms:jakarta.jms-api'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'io.rest-assured:rest-assured:6.0.1'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.junit.platform:junit-platform-suite'
  testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
  testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
  testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
  testImplementation "net.serenity-bdd:serenity-rest-assured:${serenityVersion}"
  testImplementation "net.serenity-bdd:serenity-report-resources:${serenityVersion}"
  testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
  testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
  testImplementation 'com.hierynomus:sshj:0.41.1'

  integrationTestImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.4.2'
  integrationTestImplementation 'org.springframework.security:spring-security-test'
  integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'com.redis:testcontainers-redis'

}

bootJar {
  archiveFileName = "opal-file-handler-service.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processFunctionalTestResources") {
  duplicatesStrategy = 'include'
}
rootProject.tasks.named("processIntegrationTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
checkstyle {
  checkstyleMain.exclude '**/generated/**'
}
tasks.register('runAllStyleChecks') {
  dependsOn 'checkstyleMain'
  dependsOn 'checkstyleTest'
  dependsOn 'checkstyleIntegrationTest'
  dependsOn 'checkstyleFunctionalTest'
  dependsOn 'checkstyleOpenapi'
}

tasks.named("openApiGenerate") {
  dependsOn 'bundleOpenApi'
  doLast {
    def generatedJavaDir = layout.buildDirectory.dir("generated/openapi/src/main/java").get().asFile
    fileTree(generatedJavaDir).matching {
      include '**/*.java'
    }.each { generatedFile ->
      generatedFile.text = generatedFile.text.replace(
              'import org.springframework.lang.Nullable;',
              'import org.jspecify.annotations.Nullable;'
      )
    }
  }
}
tasks.named("compileJava") {
  dependsOn 'openApiGenerate'
  xmlSchemasToGenerate.each { schemaName, ignored ->
    dependsOn tasks.named("generate${schemaName.toString().capitalize()}Jaxb")
  }
}

tasks.register('migratePostgresDatabase', FlywayMigrateTask) {
  baselineOnMigrate = true
  def taskUrl = providers.gradleProperty("dburl")
      .map { dbUrl -> "jdbc:postgresql://${dbUrl}" }
      .orElse(providers.environmentVariable("FLYWAY_URL"))
      .orNull
  if (taskUrl) {
    url = taskUrl
  }
}

rootProject.tasks.named("processIntegrationTestResources") {
  duplicatesStrategy = 'include'
}

apply from: "${rootDir}/gradle/zephyr.gradle"
