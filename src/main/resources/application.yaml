server:
  port: 4075
  shutdown: "graceful"

management:
  health:
    redis:
      enabled: ${opal.redis.enabled:false}
  endpoint:
    health:
      show-details: "always"

  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

springdoc:
  packagesToScan: uk.gov.hmcts.opal.controllers,uk.gov.hmcts.opal.authentication.controller
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/opal/"
  application:
    name: Opal File Handler Service
  security:
    oauth2:
      client:
        registration:
          internal-azure-ad:
            client-id: ${AAD_CLIENT_ID:00000000-0000-0000-0000-000000000000}
            client-secret: ${AAD_CLIENT_SECRET:}
            scope: api://${AAD_CLIENT_ID:00000000-0000-0000-0000-000000000000}/opalinternaluser
            redirect-uri: ${opal.frontend.url}/sso/login-callback
            logout-redirect-uri: ${opal.frontend.url}/sso/logout-callback
            authorization-grant-type: authorization_code
            response-type: code
            response-mode: form_post
            prompt: login
            issuer-uri: https://sts.windows.net/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/
            claims: preferred_username
            provider: internal-azure-ad-provider
        provider:
          internal-azure-ad-provider:
            authorization-uri: ${opal.azure.active-directory-justice-auth-uri}/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/oauth2/v2.0/authorize
            token-uri: ${opal.azure.active-directory-justice-auth-uri}/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/oauth2/v2.0/token
            jwk-set-uri: ${opal.azure.active-directory-justice-auth-uri}/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/discovery/v2.0/keys
            logout-uri: ${opal.azure.active-directory-justice-auth-uri}/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/oauth2/v2.0/logout
            reset-password-uri: ${opal.azure.active-directory-justice-auth-uri}/${AAD_TENANT_ID:00000000-0000-0000-0000-000000000000}/oauth2/v2.0/authorize
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${OPAL_FILE_HANDLER_DB_HOST:localhost}:${OPAL_FILE_HANDLER_DB_PORT:5432}/${OPAL_FILE_HANDLER_DB_NAME:opal-file-handler-db}${OPAL_FILE_HANDLER_DB_OPTIONS:}
    username: ${OPAL_FILE_HANDLER_DB_USERNAME:opal-db-user}
    password: ${OPAL_FILE_HANDLER_DB_PASSWORD:opal-db-password}
    properties:
      charSet: UTF-8
    hikari:
      minimumIdle: 2
      maximumPoolSize: 10
      idleTimeout: 10000
      poolName: OpalHikariCP
      maxLifetime: 7200000
      connectionTimeout: 30000
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        generate_statistics: false
        log_slow_query: 9
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          # Following setting is 'generally' suggested to be false, or a lot of work otherwise
          provider_disables_autocommit: false
          # The following mode is advised against? Used only with a JTA Datasource.
          # handler_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT
        jdbc:
          lob:
            # silence the 'wall-of-text' - unnecessary exception throw about blob types
            non_contextual_creation: true
  data:
    redis:
      url: ${REDIS_CONNECTION_STRING:redis://redis:6379}
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/dev}
    baseline-on-migrate: true
    ignoreMigrationPatterns: "*:missing"

opal:
  frontend:
    url: ${OPAL_FRONTEND_URL:http://localhost:4200}
  azure:
    active-directory-justice-auth-uri: https://login.microsoftonline.com
  testing-support-endpoints:
    enabled: ${TESTING_SUPPORT_ENDPOINTS_ENABLED:false}
  common:
    system-users:
      token-url: https://login.microsoftonline.com/${AAD_TENANT_ID:}/oauth2/v2.0/token
      users:
        opal-system-user:
          client-id: ${OPAL_SYSTEM_USER_CLIENT_ID:}
          client-secret: ${OPAL_SYSTEM_USER_CLIENT_SECRET:}
          scope: api://${opal.common.system-users.users.opal-system-user.client-id}/.default
          grant-type: client_credentials
    service-bus:
      enabled: true
      connection-string: ${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local;UseDevelopmentEmulator=true}
      protocol: ${SERVICEBUS_PROTOCOL:amqp}
      idle-timeout-ms: ${SERVICEBUS_IDLE_TIMEOUT_MS:30000}
      send-timeout-ms: ${SERVICEBUS_SEND_TIMEOUT_MS:10000}
      queues:
        maintenance-interface-file-preprocess: ${SERVICEBUS_INTERFACE_FILE_PREPROCESS_MAINTENANCE_QUEUE_NAME:banking-interfaces-preprocess-interface-file-maintenance}
        fines-interface-file-preprocess: ${SERVICEBUS_INTERFACE_FILE_PREPROCESS_FINES_QUEUE_NAME:banking-interfaces-preprocess-interface-file-fines}
    domain: file-handler
    content-digest:
      request:
        enforce: ${OPAL_COMMON_CONTENT_DIGEST_REQUEST_ENFORCE:true}
        auto-generate: ${OPAL_COMMON_CONTENT_DIGEST_REQUEST_AUTO_GENERATE:true}
      response:
        enforce: ${OPAL_COMMON_CONTENT_DIGEST_RESPONSE_ENFORCE:false}
        algorithm: ${OPAL_COMMON_CONTENT_DIGEST_RESPONSE_ALGORITHM:SHA-512}
      supported-algorithms:
        sha-512: SHA-512
  file-handler-service:
    extraction-service:
      max-retries: ${EXTRACTION_SERVICE_MAX_RETRIES:5}
    file-store:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
      account-name: ${FILE_STORE_STORAGE_ACCOUNT_NAME:}
      endpoint: ${FILE_STORE_STORAGE_URL:}
      account-key: ${FILE_STORE_STORAGE_KEY:}
    file-types:
      caps-report:
        container-name: ${CAPS_REPORT_AZURE_STORAGE_CONTAINER:caps-report}
        feature-flag: caps-report-file-transfer-job
        file-name-regex: ^CapFa\.GB\.\d{8}\.\d{6}\.xml$
        source: CAPS_REPORT
        target: OPAL
        sftp-username: ${BAIS_SFTP_CAPS_REPORT_USERNAME:}
      bteckoh-report:
        container-name: ${BTECKOH_REPORT_AZURE_STORAGE_CONTAINER:bteckoh-report}
        feature-flag: bteckoh-report-file-transfer-job
        file-name-regex: ^2498-MCPLDB-MOJ-Payments-Report-Daily-\d{4}-\d{2}-\d{2}-\d{2}-\d{2}-\d{2}\.xlsx$
        source: BTECKOH_REPORT
        target: OPAL
        sftp-username: ${BAIS_SFTP_BTECKOH_REPORT_USERNAME:}
      allpay:
        container-name: ${ALLPAY_AZURE_STORAGE_CONTAINER:allpay}
        feature-flag: allpay-file-transfer-job
        file-name-regex: ^a121_\d{8}_\d{6}\.(dat|err|crf|dir|sta)$
        source: ALLPAY
        target: OPAL
        sftp-username: ${BAIS_SFTP_ALLPAY_USERNAME:}
      dwp:
        container-name: ${DWP_AZURE_STORAGE_CONTAINER:dwp}
        feature-flag: dwp-file-transfer-job
        file-name-regex: ^\d{10}_dat_\d{10}_\d{8}_\d{6}\.txt$
        source: DWP
        target: OPAL
        sftp-username: ${BAIS_SFTP_DWP_USERNAME:}
      natwest:
        container-name: ${NATWEST_AZURE_STORAGE_CONTAINER:natwest}
        feature-flag: natwest-file-transfer-job
        file-name-regex: (Y01A\.FPCAS\.#D\.C\d{6}\.D\d{6}|Y01A\.CARS\.#D\.SBURZ\d{2}\.D\d{6})
        source: NATWEST
        target: OPAL
        sftp-username: ${BAIS_SFTP_NATWEST_USERNAME:}
      barclaycard:
        container-name: ${BARCLAYCARD_AZURE_STORAGE_CONTAINER:barclaycard}
        feature-flag: barclaycard-file-transfer-job
        file-name-regex: a121_\d{8}_\d{6}\.dat
        source: BARCLAYCARD
        target: OPAL
        sftp-username: ${BAIS_SFTP_BARCLAYCARD_USERNAME:}
      bteckoh-transfer:
        container-name: ${BTECKOH_AZURE_STORAGE_CONTAINER:bteckoh}
        feature-flag: bteckoh-file-transfer-job
        file-name-regex: ^a121_\d{8}_\d{6}\.dat$
        source: BTECKOH
        target: OPAL
        sftp-username: ${BAIS_SFTP_BTECKOH_USERNAME:}
      bailiffs:
        jacobs:
          container-name: ${JACOBS_AZURE_STORAGE_CONTAINER:jacobs}
          feature-flag: bailiffs.jacobs-file-transfer-job
          file-name-regex: ^\d{10}_dat_\d{10}_\d{8}_\d{6}\.txt$
          source: JACOBS
          target: OPAL
          sftp-username: ${BAIS_SFTP_JACOBS_USERNAME:}
        cder:
          container-name: ${CDER_AZURE_STORAGE_CONTAINER:cder}
          feature-flag: bailiffs.cder-file-transfer-job
          file-name-regex: \d{10}_dat_\d{10}_\d{8}_\d{6}.txt
          source: CDER
          target: OPAL
          sftp-username: ${BAIS_SFTP_CDER_USERNAME:}
    sftp:
      bais:
        host: ${BAIS_SFTP_CONNECTION_HOST:localhost}
        port: ${BAIS_SFTP_CONNECTION_PORT:2222}
        private-key: ${BAIS_SFTP_PRIVATE_KEY:}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    opal: ${OPAL_LOG_LEVEL:INFO}
    org:
      hibernate:
        stat: INFO
        SQL: INFO
        SQL_SLOW: INFO
        type:
          descriptor:
            sql:
              BasicBinder: WARN
        orm:
          jdbc:
            bind: INFO
launchdarkly:
  sdk-key: ${LAUNCH_DARKLY_SDK_KEY:}
  offline-mode: ${LAUNCH_DARKLY_OFFLINE_MODE:false}
  env: ${LAUNCH_DARKLY_ENV:default}
  enabled: ${LAUNCH_DARKLY_ENABLED:true}
  file:
    - ${LAUNCH_DARKLY_FILE:bin/utils/launchdarkly-flags.json}
  default-flag-values:
    release-1a: ${RELEASE_1A_ENABLED:false}
    release-1b: ${RELEASE_1B_ENABLED:false}
    release-1c: ${RELEASE_1C_ENABLED:false}
    release-1c-banking-interfaces: ${RELEASE_1C_BANKING_INTERFACES_ENABLED:false}
    caps-report-file-transfer-job: ${CAPS_REPORT_FILE_TRANSFER_JOB_ENABLED:false}
    bteckoh-report-file-transfer-job: ${BTECKOH_REPORT_FILE_TRANSFER_JOB_ENABLED:false}
    allpay-file-transfer-job: ${ALLPAY_FILE_TRANSFER_JOB_ENABLED:false}
    dwp-file-transfer-job: ${DWP_FILE_TRANSFER_JOB_ENABLED:false}
    bteckoh-file-transfer-job: ${BTECKOH_FILE_TRANSFER_JOB_ENABLED:false}
    natwest-file-transfer-job: ${NATWEST_FILE_TRANSFER_JOB_ENABLED:false}
    barclaycard-file-transfer-job: ${BARCLAYCARD_FILE_TRANSFER_JOB_ENABLED:false}
    bailiffs:
      jacobs-file-transfer-job: ${JACOBS_FILE_TRANSFER_JOB_ENABLED:false}
      cder-file-transfer-job: ${CDER_FILE_TRANSFER_JOB_ENABLED:false}

user:
  service:
    url: ${OPAL_USER_SERVICE_API_URL:http://localhost:4555}
azure:
  application-insights:
    instrumentation-key: ${opal.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
dbMigration:
  # When true, the app will run DB migration on startup.
  # Otherwise, it will just check if all migrations have been applied (and fail to start if not).
  runOnStartup: ${RUN_DB_MIGRATION_ON_STARTUP:true}
